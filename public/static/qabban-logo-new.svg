<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Neon amber glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for main elements -->
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black background -->
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  
  <!-- Subtle radial glow bg behind logo -->
  <radialGradient id="bgGlow" cx="50%" cy="45%" r="45%">
    <stop offset="0%" stop-color="#3D1F00" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEELYARD SCALE (القبان)                       -->
  <!-- Main horizontal beam                           -->
  <!-- ═══════════════════════════════════════════════ -->
  
  <!-- Center pivot circle (top) -->
  <circle cx="512" cy="178" r="18" fill="none" stroke="#F5A623" stroke-width="3.5" filter="url(#neonGlow)"/>
  
  <!-- Center pivot diamond -->
  <polygon points="512,196 525,218 512,240 499,218" fill="none" stroke="#F5A623" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Main beam arm - full horizontal bar -->
  <!-- Left arm from pivot to left hanging point -->
  <line x1="512" y1="218" x2="200" y2="258" stroke="#F5A623" stroke-width="4.5" filter="url(#neonGlow)"/>
  <!-- Right arm from pivot to counterweight -->
  <line x1="512" y1="218" x2="820" y2="248" stroke="#F5A623" stroke-width="4.5" filter="url(#neonGlow)"/>
  
  <!-- Left arm decorative diamond joint -->
  <polygon points="200,258 215,270 200,282 185,270" fill="none" stroke="#F5A623" stroke-width="2.5" filter="url(#neonGlow)"/>
  
  <!-- Scale graduation marks on right arm (ruler ticks) -->
  <line x1="580" y1="234" x2="580" y2="246" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="620" y1="237" x2="620" y2="249" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="660" y1="240" x2="660" y2="252" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="700" y1="242" x2="700" y2="254" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="740" y1="244" x2="740" y2="256" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="780" y1="246" x2="780" y2="258" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  
  <!-- Counterweight block on right end -->
  <rect x="808" y="238" width="32" height="50" rx="3" fill="none" stroke="#F5A623" stroke-width="3.5" filter="url(#neonGlow)"/>
  <!-- Inner rectangle of counterweight -->
  <rect x="816" y="250" width="16" height="26" rx="2" fill="none" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <!-- Arrow point on far right -->
  <polygon points="840,263 860,263 860,263 840,258" fill="#F5A623" filter="url(#neonGlow)"/>
  <line x1="840" y1="263" x2="875" y2="263" stroke="#F5A623" stroke-width="3" filter="url(#neonGlow)"/>
  <polygon points="875,257 890,263 875,269" fill="#F5A623" filter="url(#neonGlow)"/>
  
  <!-- Left hanging chain/rope from diamond joint -->
  <line x1="200" y1="282" x2="200" y2="320" stroke="#F5A623" stroke-width="2.5" filter="url(#neonGlow)"/>
  
  <!-- Left pan - diamond/triangular shape -->
  <!-- Pan top connecting bar -->
  <line x1="160" y1="320" x2="240" y2="320" stroke="#F5A623" stroke-width="2.5" filter="url(#neonGlow)"/>
  <!-- Left chain to pan -->
  <line x1="160" y1="320" x2="145" y2="360" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <!-- Right chain to pan -->
  <line x1="240" y1="320" x2="255" y2="360" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  
  <!-- Pan body - diamond/tray shape -->
  <polygon points="145,360 255,360 230,440 170,440" fill="none" stroke="#F5A623" stroke-width="3" filter="url(#neonGlow)"/>
  <!-- Bottom tip of pan -->
  <line x1="170" y1="440" x2="200" y2="470" stroke="#F5A623" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="230" y1="440" x2="200" y2="470" stroke="#F5A623" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Coffee beans inside the pan -->
  <!-- Bean 1 - left side -->
  <ellipse cx="175" cy="405" rx="16" ry="22" fill="none" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)" transform="rotate(-15, 175, 405)"/>
  <line x1="175" y1="383" x2="175" y2="427" stroke="#F5A623" stroke-width="1.5" filter="url(#neonGlow)" transform="rotate(-15, 175, 405)"/>
  
  <!-- Bean 2 - right side -->
  <ellipse cx="225" cy="400" rx="16" ry="22" fill="none" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)" transform="rotate(20, 225, 400)"/>
  <line x1="225" y1="378" x2="225" y2="422" stroke="#F5A623" stroke-width="1.5" filter="url(#neonGlow)" transform="rotate(20, 225, 400)"/>
  
  <!-- Bean 3 - top center small -->
  <ellipse cx="200" cy="375" rx="11" ry="15" fill="none" stroke="#F5A623" stroke-width="2" filter="url(#neonGlow)"/>
  <line x1="200" y1="360" x2="200" y2="390" stroke="#F5A623" stroke-width="1.5" filter="url(#neonGlow)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ARABIC TEXT: قبان (Qabban)                    -->
  <!-- Using path-based approach for the calligraphy  -->
  <!-- ═══════════════════════════════════════════════ -->
  
  <!-- Arabic قبان - rendered as large golden text -->
  <!-- Since we cannot guarantee Arabic font, we'll use a styled SVG text with fallback -->
  <text 
    x="560" 
    y="470" 
    font-family="'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', 'Arabic Typesetting', serif"
    font-size="210"
    font-weight="bold"
    fill="#F5A623"
    text-anchor="middle"
    direction="rtl"
    filter="url(#textGlow)"
  >قبان</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LATIN TEXT: QABBAN                            -->
  <!-- ═══════════════════════════════════════════════ -->
  <text 
    x="512" 
    y="600"
    font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', 'Georgia', serif"
    font-size="100"
    font-weight="bold"
    fill="#F5A623"
    text-anchor="middle"
    letter-spacing="18"
    filter="url(#textGlow)"
  >QABBAN</text>

</svg>